name: MallU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-regression:
    name: API regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mallu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MALLU_DB_URL: jdbc:mysql://127.0.0.1:3306/mallu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      MALLU_DB_USERNAME: root
      MALLU_DB_PASSWORD: root
      MALLU_REDIS_HOST: 127.0.0.1
      MALLU_REDIS_PORT: 6379
      MALLU_JWT_SECRET: bWFsbHVfY2lfdGVzdF9qd3Rfc2VjcmV0X2tleV9wbGVhc2VfY2hhbmdlX2lmX2RlcGxveWluZw==
      MALLU_SIGNATURE_SECRET: mallu-ci-signing-secret-only-for-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize test database
        run: mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -proot < src/main/resources/sql/init.sql

      - name: Start MallU backend
        run: |
          chmod +x ./mvnw
          ./mvnw spring-boot:run > mallu-app.log 2>&1 &
          echo $! > mallu-app.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/products?page=1\&size=1 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat mallu-app.log
          exit 1

      - name: Run API regression tests
        run: ./mvnw "-Dmallu.signature.secret=$MALLU_SIGNATURE_SECRET" test

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mallu-backend-log
          path: mallu-app.log
          if-no-files-found: ignore

  frontend-build:
    name: Vue production build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Vue application
        working-directory: web
        run: |
          npm ci
          npm run build
