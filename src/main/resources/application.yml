server:
  port: ${MALLU_SERVER_PORT:8080}

spring:
  application:
    name: MallU
  datasource:
    url: ${MALLU_DB_URL:jdbc:mysql://localhost:3306/mallu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MALLU_DB_USERNAME:root}
    password: ${MALLU_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  data:
    redis:
      host: ${MALLU_REDIS_HOST:localhost}
      port: ${MALLU_REDIS_PORT:6379}
      connect-timeout: ${MALLU_REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${MALLU_REDIS_TIMEOUT:1s}
  rabbitmq:
    host: ${MALLU_RABBITMQ_HOST:localhost}
    port: ${MALLU_RABBITMQ_PORT:5672}
    username: ${MALLU_RABBITMQ_USERNAME}
    password: ${MALLU_RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
  sql:
    init:
      mode: never

mallu:
  jwt:
    secret: ${MALLU_JWT_SECRET}
    expiration-seconds: ${MALLU_JWT_EXPIRATION_SECONDS:7200}
  mq:
    enabled: ${MALLU_MQ_ENABLED:true}
  seckill:
    retry-delay-ms: ${MALLU_SECKILL_RETRY_DELAY_MS:3000}
    max-retries: ${MALLU_SECKILL_MAX_RETRIES:3}
    test-fail-attempts: ${MALLU_SECKILL_TEST_FAIL_ATTEMPTS:0}
  order:
    timeout-minutes: ${MALLU_ORDER_TIMEOUT_MINUTES:30}
    timeout-scan-ms: ${MALLU_ORDER_TIMEOUT_SCAN_MS:60000}
