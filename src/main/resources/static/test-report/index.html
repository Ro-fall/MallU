:"JSON 可消费","type":"REL/D","module":"SEC","status":"pending","source":""},{"id":"SEC-060","name":"reset 后 MQ/Redis 清理策略","assertion":"无旧 MallU 秒杀残留","type":"REL/D","module":"SEC","status":"pending","source":""}],"modules":[{"key":"AUTH","name":"用户与鉴权","total":35,"passed":21},{"key":"CAT","name":"商品与目录","total":35,"passed":22},{"key":"CART","name":"地址与购物车","total":45,"passed":22},{"key":"ORDER","name":"订单","total":55,"passed":29},{"key":"MKT","name":"营销","total":30,"passed":14},{"key":"REDIS","name":"Redis 可靠性","total":40,"passed":16},{"key":"SEC","name":"秒杀与 RabbitMQ","total":60,"passed":32}]};let status='all',module='all';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label={AUTH:'用户与鉴权',CAT:'商品与目录',CART:'地址与购物车',ORDER:'订单',MKT:'营销',REDIS:'Redis 可靠性',SEC:'秒杀与 RabbitMQ'};document.querySelector('#timestamp').textContent='快照生成：'+report.generatedAt;document.querySelector('#coverage').textContent=report.passed+' / '+report.total;document.querySelector('#coverageText').textContent='覆盖率 '+(report.passed/report.total*100).toFixed(1)+'%';document.querySelector('#passed').textContent=report.passed;document.querySelector('#pending').textContent=report.total-report.passed;document.querySelector('#modules').textContent=report.modules.length;document.querySelector('#moduleGrid').innerHTML=report.modules.map(m=>`<article class="module"><b>${m.key}</b><span>${m.passed}/${m.total}</span><div class="bar"><i style="width:${m.passed/m.total*100}%"></i></div></article>`).join('');const chips=[['all','全部'],['passed','已通过'],['pending','待自动化'],...report.modules.map(m=>[m.key,label[m.key]])];document.querySelector('#chips').innerHTML=chips.map(([k,n])=>`<button class="chip ${k==='all'?'active':''}" data-k="${k}">${n}</button>`).join('');function render(){const q=document.querySelector('#search').value.trim().toLowerCase();const visible=report.cases.filter(c=>(status==='all'||c.status===status)&&(module==='all'||c.module===module)&&(!q||[c.id,c.name,c.assertion,c.source].join(' ').toLowerCase().includes(q)));document.querySelector('#rows').innerHTML=visible.map(c=>`<tr><td class="id">${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.assertion)}</td><td>${esc(c.type)}</td><td><span class="status ${c.status}">${c.status==='passed'?'已通过':'待自动化'}</span></td><td class="source">${esc(c.source||'—')}</td></tr>`).join('')||'<tr><td colspan="6">没有匹配的用例。</td></tr>'}document.querySelector('#search').addEventListener('input',render);document.querySelector('#chips').addEventListener('click',e=>{if(!e.target.dataset.k)return;const k=e.target.dataset.k;if(k==='all'||k==='passed'||k==='pending'){status=k;module='all'}else{status='all';module=k}document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===e.target));render()});render();</script></body></html>
